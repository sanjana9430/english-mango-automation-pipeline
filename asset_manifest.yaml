# Curated asset list, seeded from ../AI video editor/scripts/build_rough_cut.py's
# own ASSET_MANIFEST. Deliberately hand-maintained, not filename-guessed — see
# SETUP.md "Asset tagging" for why. Add one entry per new asset you want eligible
# for posting; anything not listed here is never selected automatically.
#
# `path` points into public_assets/ — a canonical copy of just the curated
# files, deployed as its own Render static site so Meta's Graph API has a
# public URL to fetch (see SETUP.md "Asset hosting"). This repo's copy is the
# one that actually gets posted; ../AI video editor/Asset/ is the working
# source you edit/replace footage in. When you approve a new asset there,
# copy it into public_assets/ and add a line here — same one-line-per-asset
# discipline as the rest of this manifest.
#
# formats: which format keys (from content_calendar.yaml) this asset is eligible for.
# role: human label used in ideation prompts and storyboard captions.

assets:
  - id: 1
    role: "Exterior Hero"
    type: image
    path: "public_assets/villa-lawn-green.jpg"
    formats: [luxury_carousel, cinematic_reel]
    default_caption: "Your private palace in Haridwar"

  - id: 2

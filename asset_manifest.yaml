# Explicitly excluded, carried over from build_rough_cut.py so this pipeline
# doesn't re-select something already ruled out there for a documented reason.
excluded:
  - pattern: "grass*.JPG"
    reason: "Pre-landscaping construction state, not finished turf."
  - pattern: "WhatsApp Image 2026-02-05* / 2026-03-22*"
    reason: "Build-progress documentation, not guest-facing."
  - pattern: "theatre.JPG, theatre 2.JPG"
    reason: "Room reads unstaged next to theatre-yoga-session.jpg."
  - pattern: "well lit pool.mp4"
    reason: "Duplicate of pool-night-loop.mp4."
  - pattern: "theatre experience.mp4"
    reason: "A third-party film is visibly playing on screen for the whole clip - not ours to publish."
  - pattern: "pool-night-loop-poster.jpg"
    reason: "Poster frame of pool-night-loop.mp4, redundant."
  - pattern: "temple-festive-entrance_1.jpg"
    reason: "Near-duplicate of the selected frame."
  - pattern: "tv2/3/5-11.JPG"
    reason: "Extra angles of the same suite, held in reserve."
